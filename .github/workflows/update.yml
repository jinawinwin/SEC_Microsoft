name: Update SEC data & deploy dashboard

on:
  schedule:
    - cron: "0 0 1 * *"   # 매월 1일 00:00 UTC (= 한국시간 09:00)
  workflow_dispatch:       # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "docs/index.html"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sec-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Crawl SEC EDGAR and rebuild dashboard data
        env:
          # SEC 공정 접근 정책: 연락처가 포함된 User-Agent 필요.
          # 본인 연락처를 쓰려면 Settings > Secrets and variables > Actions > Variables 에
          # SEC_USER_AGENT = "이름 이메일@도메인" 으로 등록하세요 (미등록 시 아래 기본값 사용).
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'SEC_Microsoft-dashboard (https://github.com/jinawinwin/SEC_Microsoft) jinawinwin@users.noreply.github.com' }}
        run: python scripts/fetch_sec.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/data README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: monthly SEC data update ($(date -u +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
